<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wrestling Pairing Pro</title>
</head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
/* Layout: scorer's-table tool. Header + tabs, then a working surface; the mat board is a grid of rounds × mats. */
:root{
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#f6f8fb; --ink:#141a24; --muted:#5a6476; --line:#d9dfe8; --line-strong:#b9c2d0;
  --accent:#1f3a8a; --accent-ink:#ffffff; --accent-soft:#e3e9f8;
  --good:#15803d; --good-soft:#dcf2e3; --warn:#b45309; --warn-soft:#fdf0d8; --bad:#b91c1c; --bad-soft:#fbe3e3;
  --focus:#f59e0b; --shadow:0 1px 2px rgba(20,26,36,.08),0 2px 8px rgba(20,26,36,.06);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --card-h:66px; --card-gap:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1319; --surface:#171c25; --surface-2:#1d2330; --ink:#e7ebf2; --muted:#9aa4b5; --line:#2a3240; --line-strong:#3b4558;
  --accent:#7d9cf0; --accent-ink:#0d1220; --accent-soft:#1f2a45;
  --good:#4ade80; --good-soft:#163222; --warn:#fbbf24; --warn-soft:#3a2c10; --bad:#f87171; --bad-soft:#3d1a1a;
  --focus:#fbbf24; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1319; --surface:#171c25; --surface-2:#1d2330; --ink:#e7ebf2; --muted:#9aa4b5; --line:#2a3240; --line-strong:#3b4558;
  --accent:#7d9cf0; --accent-ink:#0d1220; --accent-soft:#1f2a45;
  --good:#4ade80; --good-soft:#163222; --warn:#fbbf24; --warn-soft:#3a2c10; --bad:#f87171; --bad-soft:#3d1a1a;
  --focus:#fbbf24; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;font-variant-numeric:tabular-nums}
#root{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 96px;max-width:1500px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);letter-spacing:.01em;margin:0;text-wrap:balance}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* Header */
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:34px;height:34px;border-radius:50%;border:3px solid var(--accent);display:grid;place-items:center;flex:none}
.brand-mark i{width:12px;height:12px;border-radius:50%;background:var(--accent);display:block}
.brand h1{font-size:24px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.tname{font-family:var(--f-display);font-size:20px;font-weight:600;border:1px solid transparent;background:transparent;border-radius:6px;padding:2px 8px;min-width:0;width:min(320px,60vw)}
.tname:hover,.tname:focus{border-color:var(--line-strong);background:var(--surface)}
.store{font-size:12px;padding:3px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line);display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.store b{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.store.shared b{background:var(--good)}
.store.saving b{background:var(--warn)}

/* Buttons */
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.solid{background:var(--bad);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 8px;font-size:13px;border-radius:6px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon{width:16px;height:16px;flex:none}

/* Tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{border:0;background:transparent;padding:10px 14px;font-family:var(--f-display);font-size:17px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .n{font-family:var(--f-body);font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 6px;margin-left:6px;letter-spacing:0}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.eyebrow{font-family:var(--f-display);font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* Chips */
.chip{display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.04em;border-radius:4px;padding:0 5px;min-width:30px;height:18px;flex:none}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:600;border-radius:999px;padding:1px 8px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.plain{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

/* Forms */
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.inp{border:1px solid var(--line-strong);background:var(--surface);border-radius:7px;padding:7px 10px;width:100%;min-width:0;max-width:100%;color:var(--ink)}
input.inp,select.inp{height:38px;line-height:1.2}
input[type="date"].inp{-webkit-appearance:none;appearance:none;display:block;text-align:left}
input[type="date"].inp::-webkit-date-and-time-value{text-align:left;min-width:0}
select.inp{text-overflow:ellipsis}
.inp:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.grid-form{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(200px,100%),1fr));gap:14px;align-items:start}
.hint{font-size:12px;font-weight:400;color:var(--muted)}

/* Empty state */
.empty{text-align:center;padding:40px 16px;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty h2{font-size:26px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;max-width:820px;width:100%;text-align:left;margin:8px 0}
.steps div{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px}
.steps b{font-family:var(--f-display);font-size:16px;display:block}

/* Roster */
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-bottom:16px}
.team-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;border-top:5px solid var(--tc)}
.team-card .row .inp{flex:1;min-width:0}
.swatch{width:34px;height:34px;border-radius:8px;border:2px solid var(--line-strong);flex:none;padding:0}
.swatches{display:grid;grid-template-columns:repeat(6,28px);gap:6px;padding:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);position:absolute;z-index:30;top:40px;left:0}
.swatches button{width:28px;height:28px;border-radius:50%;border:2px solid transparent;padding:0}
.swatches button[aria-pressed="true"]{border-color:var(--ink)}
.swatches label.cs{width:28px;height:28px;border-radius:50%;border:2px solid var(--line-strong);background:conic-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);position:relative;overflow:hidden;cursor:pointer}
.swatches label.cs input{position:absolute;inset:-8px;width:44px;height:44px;opacity:0;cursor:pointer}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.05em;font-size:13px;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
.name-cell{display:flex;gap:8px;align-items:center}

/* Two-pane (Bouts) */
.split{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:16px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.wlist{display:flex;flex-direction:column;gap:4px;max-height:calc(100vh - 260px);overflow-y:auto;padding-right:4px}
.wrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-left:4px solid var(--tc);background:var(--surface);border-radius:8px;text-align:left;width:100%}
.wrow:hover{background:var(--surface-2)}
.wrow[aria-current="true"]{outline:2px solid var(--accent);outline-offset:-1px}
.wrow .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.count{font-family:var(--f-display);font-weight:700;font-size:20px;min-width:24px;text-align:center}
.count.low{color:var(--bad)}
.sugg{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:10px;border:1px solid var(--line);border-left:4px solid var(--tc);border-radius:8px;background:var(--surface);text-align:left;width:100%}
.sugg:hover{border-color:var(--accent)}
.sugg.expanded{background:var(--warn-soft)}
.sugg.outside{background:var(--bad-soft)}
.cmp{display:flex;gap:4px;flex-wrap:wrap;grid-column:1/-1}
.stack{display:flex;flex-direction:column;gap:8px}
.sep{border:0;border-top:1px solid var(--line);margin:2px 0;width:100%}
.notice{padding:10px 12px;border-radius:8px;font-size:14px;display:flex;gap:8px;align-items:flex-start}
.notice.warn{background:var(--warn-soft);color:var(--warn)}
.notice.bad{background:var(--bad-soft);color:var(--bad)}
.notice.good{background:var(--good-soft);color:var(--good)}
.notice.info{background:var(--accent-soft);color:var(--ink)}

/* Mat board */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat .v{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1}
.stat .v.bad{color:var(--bad)}
.stat .bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-top:6px}
.stat .bar i{display:block;height:100%;background:var(--accent)}
.board-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.board-tools .inp{max-width:260px}
.board{overflow-x:auto;padding-bottom:8px}
.board-grid{display:grid;gap:10px;align-items:start}
.rounds{padding-top:44px;display:flex;flex-direction:column;gap:var(--card-gap)}
.rounds div{height:var(--card-h);display:flex;align-items:center;justify-content:flex-end;font-family:var(--f-display);font-weight:600;font-size:13px;color:var(--muted);padding-right:2px}
.mat{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;min-width:0;transition:box-shadow .15s}
.mat.over{box-shadow:0 0 0 3px var(--accent)}
.mat-head{height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid var(--line);background:var(--surface);border-radius:10px 10px 0 0}
.mat-head h3{font-size:19px;text-transform:uppercase;letter-spacing:.06em}
.mat-body{padding:6px;display:flex;flex-direction:column;gap:var(--card-gap);min-height:120px}
.mat-empty{border:2px dashed var(--line-strong);border-radius:8px;height:var(--card-h);display:grid;place-items:center;color:var(--muted);font-size:13px}
.bout{height:var(--card-h);display:grid;grid-template-columns:18px 46px minmax(0,1fr) auto;align-items:center;gap:6px;padding:0 8px 0 2px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);position:relative;user-select:none;-webkit-user-select:none;cursor:grab;touch-action:pan-y}
.bout.violation{border-left:4px solid var(--bad)}
.bout.selected{outline:2px solid var(--accent);outline-offset:-1px}
.bout.dim{opacity:.28}
.bout.lit{outline:3px solid var(--focus);outline-offset:-1px}
.bout.placeholder{opacity:.25;border-style:dashed;box-shadow:none}
.bout.fresh{animation:fresh 2.4s ease-out}
@keyframes fresh{0%,40%{box-shadow:0 0 0 3px var(--good)}100%{box-shadow:var(--shadow)}}
.grip{height:100%;display:grid;place-items:center;color:var(--line-strong);touch-action:none;cursor:grab}
.bnum{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1;text-align:center}
.side{display:flex;flex-direction:column;gap:3px;min-width:0}
.wl{display:flex;align-items:center;gap:5px;min-width:0;border:0;background:transparent;padding:1px 2px;border-radius:4px;text-align:left;font-size:14px}
.wl:hover{background:var(--surface-2)}
.wl .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.wl .wt{color:var(--muted);font-size:13px;margin-left:auto;padding-left:4px}
.wl.rest .nm{color:var(--bad)}
.meta{display:flex;flex-direction:column;gap:3px;align-items:flex-end}
.meta .pill{font-size:11px;padding:0 6px}
.drop{height:0;position:relative}
.drop::before{content:"";position:absolute;left:4px;right:4px;top:-5px;height:4px;border-radius:2px;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.drag-ghost{position:fixed;z-index:100;pointer-events:none;transform:rotate(1.5deg);box-shadow:0 10px 30px rgba(0,0,0,.25);cursor:grabbing}
body.dragging{cursor:grabbing}
body.dragging *{cursor:grabbing !important}

/* Action bar */
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line-strong);box-shadow:0 -4px 16px rgba(0,0,0,.12);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.actionbar .inner{max-width:1500px;margin:0 auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line);background:var(--surface);padding:6px 10px;font-weight:600}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* Modal */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.45);z-index:60;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;width:min(640px,100%);max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{width:min(900px,100%)}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.modal-h h2{font-size:22px}
.modal-b{padding:18px;display:flex;flex-direction:column;gap:14px}
textarea.inp{min-height:180px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.errs{max-height:140px;overflow:auto;font-size:13px;background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:8px 12px;margin:0}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.18);z-index:50;width:min(340px,90vw);padding:6px}
.menu .item{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;padding:8px 10px;border-radius:6px;text-align:left}
.menu .item:hover{background:var(--surface-2)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 0}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:90;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:min(560px,92vw)}
.toast.raise{bottom:calc(88px + env(safe-area-inset-bottom,0px))}

@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
/* ===== UX/design polish layer ===== */
:root{--accent:#1d3fa6;--accent-soft:#e6ecfb;--bg:#eceff4;--radius:12px;
  --shadow:0 1px 2px rgba(20,26,36,.06),0 4px 14px -6px rgba(20,26,36,.12);
  --shadow-lift:0 2px 4px rgba(20,26,36,.06),0 12px 28px -10px rgba(20,26,36,.22)}
body{margin:0;background:radial-gradient(1200px 400px at 50% -200px,var(--accent-soft),transparent 70%),var(--bg);background-attachment:fixed;-webkit-font-smoothing:antialiased}
.btn,.tab,.wrow,.sugg,.team-card,.stat,.bout,.inp,.pill{transition:background-color .15s,border-color .15s,box-shadow .18s,transform .18s,color .15s}
/* sticky app bar */
.top{position:sticky;top:0;z-index:35;margin:0 0 12px;padding:10px 0;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px)}
.brand-mark{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.brand-mark i{background:var(--accent-ink);width:10px;height:10px}
.tname{border-radius:8px}
.tname:hover::placeholder{color:var(--muted)}
.store{padding:4px 10px;box-shadow:var(--shadow)}
.store.shared b{box-shadow:0 0 0 3px var(--good-soft)}
.store.saving b{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
/* buttons */
.btn{border-radius:9px;min-height:36px;box-shadow:0 1px 1px rgba(20,26,36,.04)}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn.primary{box-shadow:0 1px 2px rgba(20,26,36,.12),0 6px 16px -8px var(--accent)}
.btn.primary:hover:not(:disabled){color:var(--accent-ink);filter:brightness(1.12);transform:translateY(-1px)}
.btn.danger:hover:not(:disabled){color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
.btn.danger.solid:hover:not(:disabled){color:#fff;background:var(--bad)}
.btn.ghost{box-shadow:none}
.btn:active:not(:disabled){transform:translateY(0) scale(.98)}
.btn.sm{min-height:30px}
/* segmented tabs */
.tabs{position:sticky;top:62px;z-index:34;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:4px;gap:4px;box-shadow:var(--shadow);width:fit-content;max-width:100%}
.tab{border:0;border-radius:8px;margin:0;padding:8px 16px;font-size:16px}
.tab:hover{color:var(--ink);background:var(--surface-2)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border:0}
.tab[aria-selected="true"] .n{background:color-mix(in srgb,var(--accent-ink) 22%,transparent);border-color:transparent;color:var(--accent-ink)}
/* surfaces */
.panel{border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.empty{padding:48px 16px}
.empty h2{font-size:32px}
.steps{counter-reset:s}
.steps div{background:var(--surface);border-radius:12px;padding:16px;position:relative;box-shadow:var(--shadow)}
.steps b{font-size:18px;margin-bottom:4px;color:var(--accent)}
.team-card{border-radius:var(--radius);box-shadow:var(--shadow)}

<div id="root"><p style="padding:40px;text-align:center;color:#5a6476">Loading Wrestling Pairing Pro…</p></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

/* ---------- helpers ---------- */
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const CLIENT = uid();
const PALETTE = ['#2563eb','#7c3aed','#16a34a','#ea580c','#dc2626','#0891b2','#ca8a04','#db2777','#0f766e','#9b1c2e','#4b5563','#111827',
  '#60a5fa','#1e3a8a','#a78bfa','#4c1d95','#4ade80','#14532d','#fb923c','#fdba74','#f87171','#7f1d1d','#22d3ee','#164e63',
  '#facc15','#a16207','#f472b6','#9d174d','#2dd4bf','#84cc16','#4d7c0f','#a855f7','#78350f','#9ca3af','#d1d5db','#000000'];
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const DEFAULT_SETTINGS = { mats: 3, maxPerMat: 30, maxWtPct: 10, prefWtPct: 5, maxAge: 1, maxSkill: 2, minMatches: 2, maxMatches: 3, minRest: 2, autoPlace: true };
const newTournament = (name = 'Untitled scramble') => ({
  id: uid(), name, eventDate: today(),
  teams: [
    { id: uid(), name: 'Team 1', abbr: 'T1', color: PALETTE[0] },
    { id: uid(), name: 'Team 2', abbr: 'T2', color: PALETTE[1] },
  ],
  wrestlers: [], matches: [], settings: { ...DEFAULT_SETTINGS },
});

const textOn = (hex) => {
  const h = (hex || '#888').replace('#', ''); const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return (0.299 * r + 0.587 * g + 0.114 * b) > 160 ? '#111' : '#fff';
};

function parseDOB(s) {
  if (s == null) return null; s = String(s).trim(); if (!s) return null;
  let y, m, d;
  if (s.includes('/')) { [m, d, y] = s.split('/').map(Number); }
  else if (/^\d{4}-\d{1,2}-\d{1,2}/.test(s)) { [y, m, d] = s.slice(0, 10).split('-').map(Number); }
  else if (/^\d{5}$/.test(s)) { const dt = new Date(Math.round((+s - 25569) * 864e5)); y = dt.getUTCFullYear(); m = dt.getUTCMonth() + 1; d = dt.getUTCDate(); }
  else return null;
  if (y < 100) y += y > 50 ? 1900 : 2000;
  if (!y || !m || !d || m < 1 || m > 12 || d < 1 || d > 31 || y < 1990 || y > 2100) return null;
  return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
}
function ageOn(dob, on) {
  if (!dob) return 0; const [y, m, d] = dob.split('-').map(Number); const [ty, tm, td] = (on || today()).split('-').map(Number);
  let a = ty - y; if (tm < m || (tm === m && td < d)) a--; return a;
}
const fmtDOB = (iso) => { if (!iso) return ''; const [y, m, d] = iso.split('-'); return `${+m}/${+d}/${y}`; };
const lastFirst = (w) => `${w.last}, ${w.first}`;

/* ---------- matching engine ---------- */
function compare(a, b, eventDate) {
  const wtPct = Math.abs(a.weight - b.weight) / Math.min(a.weight, b.weight) * 100;
  const ageDiff = Math.abs(ageOn(a.dob, eventDate) - ageOn(b.dob, eventDate));
  const skillDiff = Math.abs(a.skill - b.skill);
  const expDiff = Math.abs((a.exp || 0) - (b.exp || 0));
  return { wtPct, ageDiff, skillDiff, expDiff };
}
const fits = (c, s, mult = 1) => c.wtPct <= s.maxWtPct * mult && c.ageDiff <= s.maxAge * mult && c.skillDiff <= s.maxSkill * mult;
const cost = (c, s) => (c.wtPct <= s.prefWtPct ? c.wtPct * 2 : c.wtPct * 3) + c.skillDiff * 1.5 + c.ageDiff * 0.5 + c.expDiff * 0.3;
const tier = (c, s) => fits(c, s) ? 'normal' : fits(c, s, 2) ? 'expanded' : 'outside';

function renumber(matches) {
  const byMat = {};
  matches.forEach(m => (byMat[m.mat] = byMat[m.mat] || []).push(m));
  const out = [];
  Object.values(byMat).forEach(list => list.sort((x, y) => x.order - y.order).forEach((m, i) => out.push({ ...m, order: i })));
  return out;
}

/* Greedy sequencer: keeps each bout on its mat, picks each mat's next bout so wrestlers get the most rest. */
function sequence(matches, mats, minRest) {
  const queues = {}; for (let i = 1; i <= mats; i++) queues[i] = [];
  matches.forEach(m => (queues[m.mat] = queues[m.mat] || []).push(m));
  Object.values(queues).forEach(q => q.sort((a, b) => a.order - b.order));
  const last = {}; const out = []; let r = 0;
  const matIds = Object.keys(queues).map(Number);
  while (matIds.some(k => queues[k].length)) {
    const rot = matIds.map((_, i) => matIds[(i + r) % matIds.length]);
    for (const mat of rot) {
      const q = queues[mat]; if (!q.length) continue;
      let best = 0, bestV = -Infinity;
      q.forEach((m, i) => {
        const ra = last[m.a] === undefined ? 99 : r - last[m.a] - 1;
        const rb = last[m.b] === undefined ? 99 : r - last[m.b] - 1;
        const rest = Math.min(ra, rb);
        const v = rest >= minRest ? 10000 - i : rest * 100 - i;
        if (v > bestV) { bestV = v; best = i; }
      });
      const [m] = q.splice(best, 1);
      out.push({ ...m, order: r }); last[m.a] = r; last[m.b] = r;
    }
    r++;
  }
  return out;
}

function restReport(matches, minRest) {
  const byW = {};
  matches.forEach(m => { (byW[m.a] = byW[m.a] || []).push(m); (byW[m.b] = byW[m.b] || []).push(m); });
  const issues = {}; // matchId -> {wid: rest}
  let count = 0;
  Object.entries(byW).forEach(([wid, list]) => {
    list.sort((x, y) => x.order - y.order);
    for (let i = 1; i < list.length; i++) {
      const rest = list[i].order - list[i - 1].order - 1;
      if (rest < minRest) {
        count++;
        [list[i], list[i - 1]].forEach(m => { issues[m.id] = issues[m.id] || {}; issues[m.id][wid] = Math.min(rest, issues[m.id][wid] ?? 99); });
      }
    }
  });
  return { issues, count };
}

function restIfPlaced(matches, wid, order) {
  let min = 99;
  matches.forEach(m => { if (m.a === wid || m.b === wid) min = Math.min(min, Math.abs(m.order - order) - 1); });
  return min;
}

/* Late add / manual add: least-populated mat, unless that would break rest and a near-tie mat would not. */
function placeBout(matches, a, b, s) {
  const counts = {}; for (let i = 1; i <= s.mats; i++) counts[i] = 0;
  matches.forEach(m => { if (counts[m.mat] !== undefined) counts[m.mat]++; });
  const mats = Object.keys(counts).map(Number).sort((x, y) => counts[x] - counts[y] || x - y);
  const min = counts[mats[0]];
  const ok = (mat) => Math.min(restIfPlaced(matches, a, counts[mat]), restIfPlaced(matches, b, counts[mat])) >= s.minRest;
  const pick = mats.find(m => counts[m] === min && ok(m)) ?? mats.find(m => counts[m] === min + 1 && ok(m)) ?? mats[0];
  return { mat: pick, order: counts[pick] };
}

function opponentsFor(w, t, matchCount, { includeOutside = false } = {}) {
  const s = t.settings;
  const already = new Set(t.matches.filter(m => m.a === w.id || m.b === w.id).map(m => m.a === w.id ? m.b : m.a));
  return t.wrestlers
    .filter(o => !o.scratched && o.id !== w.id && o.team !== w.team && !already.has(o.id))
    .map(o => { const c = compare(w, o, t.eventDate); return { w: o, ...c, tier: tier(c, s), cost: cost(c, s), count: matchCount[o.id] || 0 }; })
    .filter(x => includeOutside || x.tier !== 'outside');
}

function countMap(matches) { const c = {}; matches.forEach(m => { c[m.a] = (c[m.a] || 0) + 1; c[m.b] = (c[m.b] || 0) + 1; }); return c; }

function autoMatch(w, t) {
  const s = t.settings; let matches = [...t.matches]; const added = [];
  const counts = countMap(matches);
  const have = counts[w.id] || 0;
  for (let k = have; k < s.minMatches; k++) {
    const opts = opponentsFor(w, { ...t, matches }, counts)
      .filter(o => o.count < s.maxMatches)
      .sort((x, y) => (x.tier === 'normal' ? 0 : 1) - (y.tier === 'normal' ? 0 : 1) || x.count - y.count || x.cost - y.cost);
    if (!opts.length) break;
    const o = opts[0];
    const spot = placeBout(matches, w.id, o.w.id, s);
    const m = { id: uid(), a: w.id, b: o.w.id, ...spot };
    matches.push(m); counts[w.id] = (counts[w.id] || 0) + 1; counts[o.w.id] = (counts[o.w.id] || 0) + 1;
    added.push({ m, opp: o.w, tier: o.tier });
  }
  return { matches, added };
}

function generate(t) {
  const s = t.settings;
  const all = t.wrestlers.filter(w => !w.scratched);
  const counts = {}; all.forEach(w => counts[w.id] = 0);
  const possible = [];
  for (let i = 0; i < all.length; i++) for (let j = i + 1; j < all.length; j++) {
    const a = all[i], b = all[j]; if (a.team === b.team) continue;
    const c = compare(a, b, t.eventDate); if (!fits(c, s)) continue;
    possible.push({ a, b, cost: cost(c, s), avgSkill: (a.skill + b.skill) / 2 });
  }
  possible.sort((x, y) => x.cost - y.cost);
  const used = new Set(); const key = (x, y) => x < y ? x + '|' + y : y + '|' + x;
  const chosen = [];
  for (let round = 0; round < s.minMatches * all.length * 2 && all.length; round++) {
    const minCount = Math.min(...Object.values(counts));
    if (minCount >= s.minMatches) break;
    const needy = all.filter(w => counts[w.id] === minCount).sort(() => Math.random() - 0.5);
    let added = false;
    for (const w of needy) {
      if (counts[w.id] > minCount || counts[w.id] >= s.maxMatches) continue;
      const cands = possible.filter(p => (p.a.id === w.id || p.b.id === w.id)).filter(p => {
        const o = p.a.id === w.id ? p.b : p.a; return counts[o.id] < s.maxMatches && !used.has(key(p.a.id, p.b.id));
      }).sort((x, y) => {
        const ox = x.a.id === w.id ? x.b : x.a, oy = y.a.id === w.id ? y.b : y.a;
        return counts[ox.id] - counts[oy.id] || x.cost - y.cost;
      });
      if (!cands.length) continue;
      const p = cands[0];
      chosen.push(p); counts[p.a.id]++; counts[p.b.id]++; used.add(key(p.a.id, p.b.id)); added = true;
    }
    if (!added) break;
  }
  // Mats: group by skill (Mat 1 = newest wrestlers), equal-sized so no mat runs long.
  chosen.sort((x, y) => x.avgSkill - y.avgSkill || x.cost - y.cost);
  const per = Math.floor(chosen.length / s.mats), extra = chosen.length % s.mats;
  let idx = 0; const matches = [];
  for (let mat = 1; mat <= s.mats; mat++) {
    const n = per + (mat <= extra ? 1 : 0);
    chosen.slice(idx, idx + n).forEach((p, i) => matches.push({ id: uid(), a: p.a.id, b: p.b.id, mat, order: i }));
    idx += n;
  }
  return sequence(matches, s.mats, s.minRest);
}

function moveBout(matches, id, mat, index) {
  const m = matches.find(x => x.id === id); if (!m) return matches;
  const rest = matches.filter(x => x.id !== id);
  const target = rest.filter(x => x.mat === mat).sort((a, b) => a.order - b.order);
  target.splice(Math.max(0, Math.min(index, target.length)), 0, { ...m, mat });
  const others = rest.filter(x => x.mat !== mat);
  return renumber([...others, ...target.map((x, i) => ({ ...x, order: i }))]);
}

/* ---------- import parsing ---------- */
function parseRoster(text) {
  const rows = [], errors = [];
  text.replace(/\r/g, '').split('\n').forEach((line, i) => {
    if (!line.trim()) return;
    const v = line.split(/[,\t]/).map(x => x.trim().replace(/^"|"$/g, ''));
    if (i === 0 && /first|name|weight|dob|birth/i.test(v.join(' '))) return;
    const n = i + 1;
    if (v.filter(Boolean).length === 0) return;
    if (v.length < 6) return errors.push(`Row ${n}: needs 6 columns, found ${v.length}`);
    const [first, last, wt, dobRaw, exp, skill] = v;
    if (!first || !last) return errors.push(`Row ${n}: first or last name is blank`);
    const weight = parseFloat(wt); if (!(weight > 0)) return errors.push(`Row ${n}: weight "${wt}" isn't a number`);
    const dob = parseDOB(dobRaw); if (!dob) return errors.push(`Row ${n}: date of birth "${dobRaw}" isn't a valid date (use MM/DD/YYYY)`);
    const e = parseInt(exp); if (isNaN(e) || e < 0 || e > 6) return errors.push(`Row ${n}: experience must be 0–6, got "${exp}"`);
    const k = parseInt(skill); if (isNaN(k) || k < 1 || k > 5) return errors.push(`Row ${n}: skill must be 1–5, got "${skill}"`);
    rows.push({ first, last, weight, dob, exp: e, skill: k });
  });
  return { rows, errors };
}

function fromLegacy(data, name) {
  const t = newTournament(name); const keys = ['t1', 't2', 't3', 't4'];
  t.teams = keys.filter(k => (data.rosters?.[k] || []).length || data.names?.[k]).slice(0, 4).map((k, i) => ({
    id: uid(), key: k, name: data.names?.[k] || `Team ${i + 1}`, abbr: data.abbrevs?.[k] || `T${i + 1}`, color: data.colors?.[k] || PALETTE[i],
  })).filter(tm => (data.rosters?.[tm.key] || []).length);
  if (!t.teams.length) t.teams = newTournament().teams;
  const idMap = {};
  const conv = (w, teamId, scratched) => {
    const id = uid(); idMap[(w.Name || '') + '|' + (w.Team || '')] = id;
    return { id, first: w.FirstName || (w.Name || '').split(' ')[0], last: w.LastName || (w.Name || '').split(' ').slice(1).join(' '), weight: +w.Weight, dob: parseDOB(w.DOB) || '2015-01-01', exp: +w.Exp || 0, skill: +w.Skill || 1, team: teamId, scratched };
  };
  t.teams.forEach(tm => (data.rosters[tm.key] || []).forEach(w => t.wrestlers.push(conv(w, tm.id, false))));
  (data.scratched || []).forEach(w => { const tm = t.teams.find(x => x.name === w.Team); if (tm) t.wrestlers.push(conv(w, tm.id, true)); });
  t.teams.forEach(tm => delete tm.key);
  const s = data.settings || {};
  t.settings = { ...DEFAULT_SETTINGS, mats: s.numberOfMats || 3, maxPerMat: s.maxPerMat || 30, maxWtPct: s.maxWt ?? 10, prefWtPct: s.preferredWt ?? 5, maxAge: s.maxAge ?? 1, maxSkill: s.maxSkill ?? 2, minMatches: s.minMatchesPerWrestler ?? 2 };
  t.matches = renumber((data.matches || []).map(m => ({ id: uid(), a: idMap[m.w1?.Name + '|' + m.w1?.Team], b: idMap[m.w2?.Name + '|' + m.w2?.Team], mat: m.mat || 1, order: m.order || 0 })).filter(m => m.a && m.b));
  return t;
}

/* ---------- storage: shared (artifact db) or this browser ---------- */
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};

async function saveFile(filename, blob) {
  const url = URL.createObjectURL(blob); const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000); return 'saved';
}

/* ---------- small UI pieces ---------- */
const I = {
  grip: <svg className="icon" viewBox="0 0 16 16" fill="currentColor"><circle cx="5" cy="3" r="1.4"/><circle cx="11" cy="3" r="1.4"/><circle cx="5" cy="8" r="1.4"/><circle cx="11" cy="8" r="1.4"/><circle cx="5" cy="13" r="1.4"/><circle cx="11" cy="13" r="1.4"/></svg>,
  undo: <svg className="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M5 3 2 6l3 3"/><path d="M2 6h8a4 4 0 0 1 0 8H7"/></svg>,
  redo: <svg className="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="m11 3 3 3-3 3"/><path d="M14 6H6a4 4 0 0 0 0 8h3"/></svg>,
  x: <svg className="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="2"><path d="M4 4l8 8M12 4l-8 8"/></svg>,
  down: <svg className="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="m4 6 4 4 4-4"/></svg>,
};

const TeamChip = ({ team }) => team ? <span className="chip" style={{ background: team.color, color: textOn(team.color) }}>{team.abbr}</span> : null;

function Modal({ title, onClose, children, wide }) {
  useEffect(() => { const k = e => e.key === 'Escape' && onClose(); window.addEventListener('keydown', k); return () => window.removeEventListener('keydown', k); }, [onClose]);
  return (
    <div className="scrim" onMouseDown={e => e.target === e.currentTarget && onClose()}>
      <div className={`modal ${wide ? 'wide' : ''}`} role="dialog" aria-modal="true" aria-label={title}>
        <div className="modal-h"><h2>{title}</h2><button className="btn ghost sm" onClick={onClose} aria-label="Close">{I.x}</button></div>
        <div className="modal-b">{children}</div>
      </div>
    </div>
  );
}

function ConfirmButton({ label, confirmLabel = 'Confirm', onConfirm, className = 'btn sm danger' }) {
  const [armed, setArmed] = useState(false);
  useEffect(() => { if (!armed) return; const t = setTimeout(() => setArmed(false), 4000); return () => clearTimeout(t); }, [armed]);
  return armed
    ? <button className={className + ' solid'} onClick={() => { setArmed(false); onConfirm(); }}>{confirmLabel}</button>
    : <button className={className} onClick={() => setArmed(true)}>{label}</button>;
}

function Compare({ a, b, eventDate, s }) {
  const c = compare(a, b, eventDate);
  const wCls = c.wtPct <= s.prefWtPct ? 'good' : c.wtPct <= s.maxWtPct ? 'warn' : 'bad';
  const lvl = (d, max) => d === 0 ? 'good' : d <= max ? 'warn' : 'bad';
  return (
    <div className="cmp">
      <span className={`pill ${wCls}`}>{a.weight} v {b.weight} lb · {c.wtPct.toFixed(1)}%</span>
      <span className={`pill ${lvl(c.ageDiff, s.maxAge)}`}>Age {ageOn(a.dob, eventDate)} v {ageOn(b.dob, eventDate)}</span>
      <span className={`pill ${lvl(c.skillDiff, s.maxSkill)}`}>Skill {a.skill} v {b.skill}</span>
      <span className={`pill ${c.expDiff <= 1 ? 'good' : 'warn'}`}>Exp {a.exp} v {b.exp}</span>
    </div>
  );
}

/* ---------- Roster tab ---------- */
function ColorButton({ value, onChange }) {
  const [open, setOpen] = useState(false); const ref = useRef(null);
  useEffect(() => { const h = e => ref.current && !ref.current.contains(e.target) && setOpen(false); document.addEventListener('pointerdown', h); return () => document.removeEventListener('pointerdown', h); }, []);
  return (
    <div style={{ position: 'relative' }} ref={ref}>

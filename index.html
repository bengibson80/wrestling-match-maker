/* ---------- Bouts tab (by wrestler) ---------- */
function BoutsTab({ t, counts, selectedId, setSelectedId, addBout, deleteBout, onlyLow, setOnlyLow }) {
  const s = t.settings;
  const teamById = Object.fromEntries(t.teams.map(x => [x.id, x]));
  const wById = Object.fromEntries(t.wrestlers.map(x => [x.id, x]));
  const [teamFilter, setTeamFilter] = useState('all');
  const [q, setQ] = useState(''); const [sort, setSort] = useState('name'); const [search, setSearch] = useState('');
  const list = t.wrestlers.filter(w => !w.scratched && (teamFilter === 'all' || w.team === teamFilter) && (!onlyLow || (counts[w.id] || 0) < s.minMatches) && (`${w.first} ${w.last}`.toLowerCase().includes(q.toLowerCase()) || String(w.weight).startsWith(q)))
    .sort(sort === 'weight' ? (a, b) => a.weight - b.weight : sort === 'bouts' ? (a, b) => (counts[a.id] || 0) - (counts[b.id] || 0) || a.last.localeCompare(b.last) : (a, b) => a.last.localeCompare(b.last));
  const sel = wById[selectedId];
  const myBouts = sel ? t.matches.filter(m => m.a === sel.id || m.b === sel.id).sort((x, y) => x.order - y.order) : [];
  const allOpps = sel ? opponentsFor(sel, t, counts, { includeOutside: true }) : [];
  const suggestions = allOpps.filter(o => o.tier !== 'outside').sort((x, y) => (x.tier === 'normal' ? 0 : 1) - (y.tier === 'normal' ? 0 : 1) || x.count - y.count || x.cost - y.cost).slice(0, 12);
  const searchHits = search.length >= 2 ? allOpps.filter(o => `${o.w.first} ${o.w.last}`.toLowerCase().includes(search.toLowerCase()) || String(o.w.weight).startsWith(search)).sort((x, y) => x.cost - y.cost).slice(0, 15) : [];

  const diagnose = () => {
    if (!sel) return null;
    const pool = t.wrestlers.filter(o => !o.scratched && o.team !== sel.team && o.id !== sel.id);
    if (!pool.length) return ['No wrestlers from other teams.'];
    const cs = pool.map(o => ({ o, ...compare(sel, o, t.eventDate) }));
    const best = (k) => cs.reduce((m, x) => x[k] < m[k] ? x : m);
    const out = [];
    const bw = best('wtPct'), ba = best('ageDiff'), bs = best('skillDiff');
    if (bw.wtPct > s.maxWtPct) out.push(`Closest weight is ${bw.o.first} ${bw.o.last} (${bw.o.weight} lb), ${bw.wtPct.toFixed(1)}% apart. Limit is ${s.maxWtPct}%.`);
    if (ba.ageDiff > s.maxAge) out.push(`Closest age gap is ${ba.ageDiff} years. Limit is ${s.maxAge}.`);
    if (bs.skillDiff > s.maxSkill) out.push(`Closest skill gap is ${bs.skillDiff}. Limit is ${s.maxSkill}.`);
    const within = cs.filter(x => fits(x, s));
    if (!out.length && within.length) out.push(`${within.length} opponent${within.length === 1 ? '' : 's'} fit the limits individually, but no single one fits all of them, or they're already wrestling ${sel.first} or at ${s.maxMatches} bouts.`);
    if (!out.length) out.push('Each limit can be met by someone, but nobody meets all of them at once. Use Search below to force a bout.');
    return out;
  };

  const opp = (o) => {
    const tm = teamById[o.w.team];
    return (
      <button key={o.w.id} className={`sugg ${o.tier === 'expanded' ? 'expanded' : o.tier === 'outside' ? 'outside' : ''}`} style={{ '--tc': tm?.color }} onClick={() => addBout(sel, o.w)}>
        <div className="row" style={{ minWidth: 0 }}><TeamChip team={tm} /><b>{o.w.first} {o.w.last}</b>
          {o.tier === 'expanded' && <span className="pill warn">Outside limits (within 2×)</span>}
          {o.tier === 'outside' && <span className="pill bad">Outside all limits</span>}
        </div>
        <span className={`pill ${o.count === 0 ? 'bad' : o.count < s.minMatches ? 'warn' : 'plain'}`}>{o.count} bout{o.count === 1 ? '' : 's'}</span>
        <Compare a={sel} b={o.w} eventDate={t.eventDate} s={s} />
      </button>
    );
  };

  return (
    <div className="split">
      <div className="stack">
        <div className="row">
          <input id="b-filter" className="inp" style={{ flex: '1 1 160px' }} placeholder="Find by name or weight" value={q} onChange={e => setQ(e.target.value)} />
          <select id="b-sort" className="inp" style={{ width: 'auto' }} value={sort} onChange={e => setSort(e.target.value)}>
            <option value="name">Name</option><option value="weight">Weight</option><option value="bouts">Fewest bouts</option>
          </select>
        </div>
        <div className="row">
          <div className="seg" role="group" aria-label="Team">
            <button aria-pressed={teamFilter === 'all'} onClick={() => setTeamFilter('all')}>All</button>
            {t.teams.map(tm => <button key={tm.id} aria-pressed={teamFilter === tm.id} onClick={() => setTeamFilter(tm.id)}>{tm.abbr}</button>)}
          </div>
          <label className="row small" style={{ gap: 6 }}><input id="b-low" type="checkbox" checked={onlyLow} onChange={e => setOnlyLow(e.target.checked)} />Under {s.minMatches} bouts only</label>
        </div>
        <div className="wlist">
          {list.map(w => {
            const tm = teamById[w.team]; const n = counts[w.id] || 0;
            return (
              <button key={w.id} className="wrow" style={{ '--tc': tm?.color }} aria-current={selectedId === w.id} onClick={() => { setSelectedId(w.id); setSearch(''); }}>
                <TeamChip team={tm} />
                <span style={{ minWidth: 0 }}><div className="nm">{w.last}, {w.first}</div><div className="small muted">{w.weight} lb · age {ageOn(w.dob, t.eventDate)} · exp {w.exp} · skill {w.skill}</div></span>
                <span className={`count ${n < s.minMatches ? 'low' : ''}`}>{n}</span>
              </button>
            );
          })}
          {!list.length && <div className="muted small" style={{ padding: 12 }}>Nobody matches this filter.</div>}
        </div>
      </div>

      <div className="panel stack" style={{ position: 'sticky', top: 'calc(8px + env(safe-area-inset-top,0px))', gap: 14 }}>
        {!sel ? <div className="muted" style={{ padding: 30, textAlign: 'center' }}>Pick a wrestler to see their bouts and add opponents.</div> : <>
          <div className="row">
            <TeamChip team={teamById[sel.team]} /><h2 style={{ fontSize: 24 }}>{sel.first} {sel.last}</h2>
            <span className="muted small">{sel.weight} lb · age {ageOn(sel.dob, t.eventDate)} · exp {sel.exp} · skill {sel.skill}</span>
          </div>
          <div className="stack">
            <div className="eyebrow">Bouts ({myBouts.length})</div>
            {!myBouts.length && <div className="muted small">No bouts yet.</div>}
            {myBouts.map(m => {
              const o = wById[m.a === sel.id ? m.b : m.a]; const tm = teamById[o?.team];
              return o && (
                <div key={m.id} className="sugg" style={{ '--tc': tm?.color, gridTemplateColumns: 'auto minmax(0,1fr) auto' }}>
                  <span className="bnum" style={{ fontSize: 20 }}>{m.mat * 100 + m.order + 1}</span>
                  <div className="row" style={{ minWidth: 0 }}><TeamChip team={tm} /><b>{o.first} {o.last}</b><span className="muted small">Mat {m.mat}, round {m.order + 1}</span></div>
                  <button className="btn sm danger" onClick={() => deleteBout(m.id)}>Remove</button>
                  <Compare a={sel} b={o} eventDate={t.eventDate} s={s} />
                </div>
              );
            })}
          </div>
          <hr className="sep" />
          <div className="stack">
            <div className="eyebrow">Suggested opponents · fewest bouts first · tap to add</div>
            {suggestions.length === 0
              ? <div className="notice bad"><div><b>No opponents within limits.</b><ul style={{ margin: '6px 0 0', paddingLeft: 18 }}>{diagnose().map((d, i) => <li key={i}>{d}</li>)}</ul></div></div>
              : suggestions.map(opp)}
          </div>
          <div className="stack">
            <div className="eyebrow">Search everyone (force a bout)</div>
            <input id="b-search" className="inp" placeholder="Name or weight, 2+ characters" value={search} onChange={e => setSearch(e.target.value)} />
            {searchHits.map(opp)}
            {search.length >= 2 && !searchHits.length && <div className="muted small">No one from another team matches "{search}".</div>}
          </div>
        </>}
      </div>
    </div>
  );
}

/* ---------- Mats tab ---------- */
function MatsTab({ t, update, counts, rest, goLow, freshIds }) {
  const s = t.settings;
  const teamById = Object.fromEntries(t.teams.map(x => [x.id, x]));
  const wById = Object.fromEntries(t.wrestlers.map(x => [x.id, x]));
  const [selected, setSelected] = useState(null);
  const [focusW, setFocusW] = useState(null);
  const [hl, setHl] = useState('');
  const [drag, setDrag] = useState(null); // {id,x,y,dx,dy,w,target}
  const dragRef = useRef(null);
  const justDragged = useRef(false);
  const boardRef = useRef(null);

  const mats = Array.from({ length: s.mats }, (_, i) => i + 1);
  const byMat = useMemo(() => { const o = {}; mats.forEach(m => o[m] = []); t.matches.forEach(m => (o[m.mat] = o[m.mat] || []).push(m)); Object.values(o).forEach(l => l.sort((a, b) => a.order - b.order)); return o; }, [t.matches, s.mats]);
  const rounds = Math.max(0, ...Object.values(byMat).map(l => l.length));
  const offMat = t.matches.filter(m => m.mat > s.mats);
  const low = t.wrestlers.filter(w => !w.scratched && (counts[w.id] || 0) < s.minMatches);

  const hlIds = useMemo(() => {
    if (focusW) return new Set([focusW]);
    const q = hl.trim().toLowerCase(); if (q.length < 2) return null;
    return new Set(t.wrestlers.filter(w => `${w.first} ${w.last}`.toLowerCase().includes(q)).map(w => w.id));
  }, [hl, focusW, t.wrestlers]);

  /* pointer-driven drag: mouse anywhere on card, touch from the grip */
  const hitTest = useCallback((x, y, dragId) => {
    const el = document.elementFromPoint(x, y); const col = el && el.closest('[data-mat]'); if (!col) return null;
    const mat = +col.dataset.mat;
    const cards = [...col.querySelectorAll('[data-bout]')].filter(c => c.dataset.bout !== dragId);
    let index = cards.length;
    for (let i = 0; i < cards.length; i++) { const r = cards[i].getBoundingClientRect(); if (y < r.top + r.height / 2) { index = i; break; } }
    return { mat, index };
  }, []);

  const onPointerDown = (e, m) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (e.pointerType === 'touch' && !e.target.closest('.grip')) return;
    const card = e.currentTarget; const r = card.getBoundingClientRect();
    const st = { id: m.id, sx: e.clientX, sy: e.clientY, x: e.clientX, y: e.clientY, dx: e.clientX - r.left, dy: e.clientY - r.top, w: r.width, active: false, target: null };
    dragRef.current = st;
    let raf = 0;
    const tick = () => {
      const d = dragRef.current; if (!d || !d.active) return;
      const edge = 70, H = window.innerHeight;
      if (d.y < edge) window.scrollBy(0, -Math.ceil((edge - d.y) / 4));
      else if (d.y > H - edge) window.scrollBy(0, Math.ceil((d.y - (H - edge)) / 4));
      const b = boardRef.current;
      if (b) { const br = b.getBoundingClientRect(); if (d.x < br.left + 50) b.scrollLeft -= 12; else if (d.x > br.right - 50) b.scrollLeft += 12; }
      d.target = hitTest(d.x, d.y, d.id); setDrag({ ...d });
      raf = requestAnimationFrame(tick);
    };
    const move = (ev) => {
      const d = dragRef.current; if (!d) return;
      d.x = ev.clientX; d.y = ev.clientY;
      if (!d.active && Math.hypot(d.x - d.sx, d.y - d.sy) > 6) { d.active = true; document.body.classList.add('dragging'); setSelected(null); raf = requestAnimationFrame(tick); }
      if (d.active) { ev.preventDefault(); }
    };
    const end = (ev) => {
      window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', end); window.removeEventListener('pointercancel', end); window.removeEventListener('keydown', esc);
      cancelAnimationFrame(raf); document.body.classList.remove('dragging');
      const d = dragRef.current; dragRef.current = null; setDrag(null);
      if (d && d.active) { justDragged.current = true; setTimeout(() => { justDragged.current = false; }, 80); }
      if (d && d.active && ev.type === 'pointerup') {
        const tg = hitTest(ev.clientX, ev.clientY, d.id);
        if (tg) {
          const cur = t.matches.find(x => x.id === d.id);
          const curIdx = byMat[cur.mat].findIndex(x => x.id === d.id);
          if (!(tg.mat === cur.mat && tg.index === curIdx)) update(p => ({ ...p, matches: moveBout(p.matches, d.id, tg.mat, tg.index) }), `Bout moved to Mat ${tg.mat}, round ${tg.index + 1}`);
        }
      }
    };
    const esc = (ev) => { if (ev.key === 'Escape') { dragRef.current = null; end({ type: 'cancel' }); } };
    window.addEventListener('pointermove', move, { passive: false }); window.addEventListener('pointerup', end); window.addEventListener('pointercancel', end); window.addEventListener('keydown', esc);
  };

  const selBout = t.matches.find(m => m.id === selected);
  const moveSel = (mat, index) => { update(p => ({ ...p, matches: moveBout(p.matches, selected, mat, index) }), `Moved to Mat ${mat}, round ${index + 1}`); };

  useEffect(() => { const k = e => { if (e.key === 'Escape') { setSelected(null); setFocusW(null); } }; window.addEventListener('keydown', k); return () => window.removeEventListener('keydown', k); }, []);

  const renderCard = (m, ghost) => {
    const A = wById[m.a], B = wById[m.b]; if (!A || !B) return null;
    const iss = rest.issues[m.id];
    const c = compare(A, B, t.eventDate);
    const lit = hlIds && (hlIds.has(m.a) || hlIds.has(m.b));
    const cls = ['bout', iss && 'violation', selected === m.id && !ghost && 'selected', hlIds && !lit && !ghost && 'dim', lit && !ghost && 'lit', drag?.id === m.id && !ghost && 'placeholder', freshIds.has(m.id) && 'fresh'].filter(Boolean).join(' ');
    const W = (w) => {
      const r = iss?.[w.id];
      return (
        <button className={`wl ${r !== undefined ? 'rest' : ''}`} onClick={(e) => { e.stopPropagation(); if (justDragged.current) return; setHl('');
            if (focusW === w.id) { setFocusW(null); setSelected(null); } else { setFocusW(w.id); setSelected(m.id); } }}
          title={r !== undefined ? (r < 0 ? `${w.first} ${w.last} is double-booked this round` : `${w.first} ${w.last}: ${r} bout${r === 1 ? '' : 's'} of rest (minimum ${s.minRest})`) : `Show all bouts for ${w.first} ${w.last}`}>
          <TeamChip team={teamById[w.team]} /><span className="nm">{w.last}, {w.first}</span><span className="wt">{w.weight}</span>
        </button>
      );
    };
    return (
      <div key={ghost ? 'ghost' : m.id} className={cls} data-bout={ghost ? undefined : m.id}
        onPointerDown={ghost ? undefined : (e) => onPointerDown(e, m)}
        onClick={ghost ? undefined : () => { if (justDragged.current) return; if (selected === m.id) { setSelected(null); setFocusW(null); } else setSelected(m.id); }}>
        <span className="grip" aria-hidden="true">{I.grip}</span>
        <span className="bnum">{m.mat * 100 + m.order + 1}</span>
        <div className="side">{W(A)}{W(B)}</div>
        <div className="meta">
          <span className={`pill ${c.wtPct <= s.prefWtPct ? 'good' : c.wtPct <= s.maxWtPct ? 'warn' : 'bad'}`}>{c.wtPct.toFixed(0)}%</span>
          {iss ? <span className="pill bad">Rest</span> : <span className="pill plain">S{((A.skill + B.skill) / 2).toFixed(1)}</span>}
        </div>
      </div>
    );
  };

  return (
    <div>
      <div className="summary">
        {mats.map(mat => (
          <div className="stat" key={mat}><div className="eyebrow">Mat {mat}</div><div className="v">{byMat[mat].length}</div>
            <div className="bar"><i style={{ width: `${rounds ? byMat[mat].length / rounds * 100 : 0}%`, background: byMat[mat].length > s.maxPerMat ? 'var(--bad)' : undefined }} /></div>
            {byMat[mat].length > s.maxPerMat && <div className="small" style={{ color: 'var(--bad)' }}>Over the {s.maxPerMat}-bout cap</div>}
          </div>
        ))}
        <div className="stat"><div className="eyebrow">Rest conflicts</div><div className={`v ${rest.count ? 'bad' : ''}`}>{rest.count}</div><div className="small muted">Under {s.minRest} bout{s.minRest === 1 ? '' : 's'} between</div></div>
        <button className="stat" style={{ textAlign: 'left', cursor: low.length ? 'pointer' : 'default' }} onClick={() => low.length && goLow()}>
          <div className="eyebrow">Under {s.minMatches} bouts</div><div className={`v ${low.length ? 'bad' : ''}`}>{low.length}</div><div className="small muted">{low.length ? 'Fix in Bouts tab →' : 'Everyone is covered'}</div>
        </button>
      </div>

      <div className="board-tools">
        <input id="m-hl" className="inp" placeholder="Highlight a wrestler…" value={hl} onChange={e => { setHl(e.target.value); setFocusW(null); }} />
        {(focusW || hl) && <button className="btn sm" onClick={() => { setFocusW(null); setHl(''); }}>Clear highlight</button>}
        <span className="spacer" />
        <button className="btn" onClick={() => update(p => ({ ...p, matches: sequence(p.matches, p.settings.mats, p.settings.minRest) }), 'Re-sequenced for rest')} title="Keeps every bout on its mat and reorders them to spread out each wrestler's bouts">Re-sequence for rest</button>
      </div>
      <p className="small muted" style={{ margin: '0 0 10px' }}>Drag a bout to reorder it or move it to another mat (on a tablet, drag by the dotted grip). Tap a bout for move buttons. Tap a name to light up all of that wrestler's bouts. Rows line up by round, so bouts side by side run at about the same time.</p>

      {offMat.length > 0 && <div className="notice warn" style={{ marginBottom: 10 }}>{offMat.length} bout{offMat.length === 1 ? ' is' : 's are'} on mats you removed in Settings. <button className="btn sm" onClick={() => update(p => { let ms = p.matches.filter(m => m.mat <= p.settings.mats); p.matches.filter(m => m.mat > p.settings.mats).forEach(m => { const spot = placeBout(ms, m.a, m.b, p.settings); ms = [...ms, { ...m, ...spot }]; }); return { ...p, matches: ms }; }, 'Moved bouts onto active mats')}>Move them to open mats</button></div>}

      <div className="board" ref={boardRef}>
        <div className="board-grid" style={{ gridTemplateColumns: `34px repeat(${s.mats}, minmax(270px, 1fr))` }}>
          <div className="rounds" aria-hidden="true">{Array.from({ length: rounds }, (_, i) => <div key={i}>R{i + 1}</div>)}</div>
          {mats.map(mat => {
            const list = byMat[mat]; const tg = drag?.target; let k = 0;
            return (
              <section key={mat} className={`mat ${tg && tg.mat === mat ? 'over' : ''}`} data-mat={mat} aria-label={`Mat ${mat}`}>
                <div className="mat-head"><h3>Mat {mat}</h3><span className="small muted">{list.length} bouts</span></div>
                <div className="mat-body">
                  {list.map(m => {
                    const isDrag = drag?.id === m.id; const showDrop = !isDrag && tg && tg.mat === mat && tg.index === k;
                    if (!isDrag) k++;
                    return <React.Fragment key={m.id}>{showDrop && <div className="drop" />}{renderCard(m, false)}</React.Fragment>;
                  })}
                  {tg && tg.mat === mat && tg.index === k && <div className="drop" />}
                  {!list.length && <div className="mat-empty">Drop bouts here</div>}
                </div>
              </section>
            );
          })}
        </div>
      </div>

      {drag && drag.active !== false && (() => { const m = t.matches.find(x => x.id === drag.id); return m ? <div className="drag-ghost" style={{ left: drag.x - drag.dx, top: drag.y - drag.dy, width: drag.w }}>{renderCard(m, true)}</div> : null; })()}

      {selBout && (() => {
        const list = byMat[selBout.mat] || []; const idx = list.findIndex(x => x.id === selBout.id);
        const A = wById[selBout.a], B = wById[selBout.b];
        return (
          <div className="actionbar"><div className="inner">
            <b style={{ fontFamily: 'var(--f-display)', fontSize: 20 }}>Bout {selBout.mat * 100 + selBout.order + 1}</b>
            <span className="muted small" style={{ minWidth: 0 }}>{A?.last} v {B?.last}</span>
            <span className="spacer" />
            <span className="small muted">Move to</span>
            <div className="seg" role="group" aria-label="Move to mat">
              {mats.map(mt => <button key={mt} aria-pressed={mt === selBout.mat} onClick={() => mt !== selBout.mat && moveSel(mt, (byMat[mt] || []).length)}>Mat {mt}</button>)}
            </div>
            <button className="btn sm" disabled={idx <= 0} onClick={() => moveSel(selBout.mat, idx - 1)}>Earlier</button>
            <button className="btn sm" disabled={idx >= list.length - 1} onClick={() => moveSel(selBout.mat, idx + 1)}>Later</button>
            <ConfirmButton label="Delete bout" confirmLabel="Delete?" onConfirm={() => { update(p => ({ ...p, matches: renumber(p.matches.filter(x => x.id !== selBout.id)) }), 'Bout deleted'); setSelected(null); }} />
            <button className="btn sm ghost" onClick={() => setSelected(null)} aria-label="Close">{I.x}</button>
          </div></div>
        );
      })()}
    </div>
  );
}

/* ---------- Settings tab ---------- */
/* Number input that keeps its own text while typing, so the field can be emptied and retyped (no stuck leading 0).
   Commits only valid numbers; an empty field reverts to the last value (or the default) on blur. */
function NumField({ id, value, onCommit, fallback, ...props }) {
  const [draft, setDraft] = useState(String(value));
  useEffect(() => { setDraft(prev => (prev !== '' && Number(prev) === Number(value) ? prev : String(value))); }, [value]);
  return (
    <input id={id} className="inp" type="number" inputMode="numeric" value={draft}
      onChange={e => { const raw = e.target.value; setDraft(raw); if (raw !== '' && !Number.isNaN(Number(raw))) onCommit(Number(raw)); }}
      onBlur={() => { if (draft === '' || Number.isNaN(Number(draft))) { const v = fallback ?? value; setDraft(String(v)); onCommit(v); } }}
      {...props} />
  );
}
function SettingsTab({ t, update }) {
  const s = t.settings;
  const commit = (k) => (v) => update(p => ({ ...p, settings: { ...p.settings, [k]: v } }), 'Settings', true);
  const set = (k, parse = Number) => (e) => { const v = parse(e.target.value); update(p => ({ ...p, settings: { ...p.settings, [k]: v } }), 'Settings', true); };
  const N = (k, label, hint, props = {}) => (
    <label className="f">{label}<NumField id={`s-${k}`} value={s[k]} onCommit={commit(k)} fallback={DEFAULT_SETTINGS[k]} {...props} />{hint && <span className="hint">{hint}</span>}</label>
  );
  return (
    <div className="stack" style={{ gap: 18, maxWidth: 980 }}>
      <div className="panel stack">
        <h2 style={{ fontSize: 20 }}>Event</h2>
        <div className="grid-form">
          <label className="f">Event date<input id="s-date" className="inp" type="date" value={t.eventDate} onChange={e => update(p => ({ ...p, eventDate: e.target.value }), 'Event date', true)} /><span className="hint">Ages are calculated as of this date.</span></label>
          <label className="f">Number of mats<select id="s-mats" className="inp" value={s.mats} onChange={set('mats')}>{[1,2,3,4,5,6].map(n => <option key={n} value={n}>{n}</option>)}</select></label>
          {N('maxPerMat', 'Bout cap per mat', 'Shown as a warning on the mat board.', { min: 1 })}
        </div>
      </div>
      <div className="panel stack">
        <h2 style={{ fontSize: 20 }}>Pairing limits</h2>
        <div className="grid-form">
          {N('maxWtPct', 'Max weight difference (%)', 'Measured against the lighter wrestler.', { min: 0, step: 0.5 })}
          {N('prefWtPct', 'Preferred weight difference (%)', 'Pairs inside this score better.', { min: 0, step: 0.5 })}
          {N('maxAge', 'Max age difference (years)', null, { min: 0 })}
          {N('maxSkill', 'Max skill difference', null, { min: 0, max: 4 })}
          {N('minMatches', 'Bouts per wrestler (target)', null, { min: 1, max: 6 })}
          {N('maxMatches', 'Bouts per wrestler (max)', null, { min: 1, max: 6 })}
        </div>
      </div>
      <div className="panel stack">
        <h2 style={{ fontSize: 20 }}>Scheduling</h2>
        <div className="grid-form">
          {N('minRest', 'Minimum rest (bouts)', "Bouts a mat runs between a wrestler's two bouts. 2 means at least two rounds off.", { min: 0, max: 10 })}
          <label className="f">Late additions<select id="s-auto" className="inp" value={s.autoPlace ? '1' : '0'} onChange={e => update(p => ({ ...p, settings: { ...p.settings, autoPlace: e.target.value === '1' } }), 'Settings', true)}>
            <option value="1">Auto-match and put on the least busy mat</option><option value="0">Add to roster only</option></select>
            <span className="hint">Applies to wrestlers added or restored after bouts exist.</span></label>
        </div>
      </div>
    </div>
  );
}

/* ---------- App ---------- */
function App() {
  const [db, setDb] = useState(null); // null = this browser only
  const [mode, setMode] = useState('starting');
  const [index, setIndex] = useState([]); // [{id,name,updatedAt}]
  const [t, setT] = useState(() => {
    const last = LS.get('wmm.last'); const saved = last && LS.get('wmm.t.' + last);
    return saved || newTournament();
  });
  const [past, setPast] = useState([]); const [future, setFuture] = useState([]);
  const [tab, setTab] = useState(() => LS.get('wmm.tab', 'roster'));
  const [toast, setToast] = useState(null);
  const [saving, setSaving] = useState(false);
  const [dialog, setDialog] = useState(null);
  const [menu, setMenu] = useState(false);
  const [selectedId, setSelectedId] = useState(null);
  const [onlyLow, setOnlyLow] = useState(false);
  const [freshIds, setFreshIds] = useState(new Set());
  const saveTimer = useRef(null); const dirty = useRef(false); const tRef = useRef(t); tRef.current = t;
  const coalesce = useRef({ label: null, at: 0 });
  const openedShared = useRef(false); const openShared = useRef(null);

  const say = useCallback((msg) => { setToast(msg); clearTimeout(say.t); say.t = setTimeout(() => setToast(null), 3200); }, []);
  useEffect(() => { LS.set('wmm.tab', tab); }, [tab]);

  /* connect storage */
  useEffect(() => {
    let cancelled = false; let unsubIndex = null;
    (async () => {
      let d = null;
      d = null; // browser-only saving: each coach's tournaments stay on their own device
      if (cancelled) return;
      if (!d) {
        setMode('local');
        const idx = LS.get('wmm.index', []);
        const legacy = LS.get('wrestlingTournaments', null);
        if (legacy && !LS.get('wmm.legacyDone')) {
          Object.entries(legacy).forEach(([name, data]) => { const nt = fromLegacy(data, name); LS.set('wmm.t.' + nt.id, nt); idx.push({ id: nt.id, name, updatedAt: data.lastModified || new Date().toISOString() }); });
          LS.set('wmm.index', idx); LS.set('wmm.legacyDone', true);
          if (Object.keys(legacy).length) say(`Brought over ${Object.keys(legacy).length} saved tournament(s) from the old version`);
        }
        setIndex(idx);
        return;
      }
      setDb(d); setMode('shared');
      unsubIndex = d.collection('index').onSnapshot(snap => {
        const idx = snap.docs.filter(x => x.exists).map(x => ({ id: x.id, ...x.data() })).sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt)));
        setIndex(idx);
        if (!openedShared.current) {
          openedShared.current = true;
          const cur = tRef.current;
          if (!idx.some(x => x.id === cur.id) && !cur.wrestlers.length && idx.length) openShared.current(idx[0].id);
        }
      }, () => setMode('local'));
    })();
    return () => { cancelled = true; unsubIndex && unsubIndex(); };
  }, []);

  /* live updates for the open tournament in shared mode */
  useEffect(() => {
    if (!db) return;
    const un = db.doc('tournaments/' + t.id).onSnapshot(snap => {
      if (!snap.exists) return;
      const data = snap.data();
      if (data.savedBy === CLIENT || !data.state) return;
      if (dirty.current) return; // our pending save wins; it lands within a second
      setT(data.state); say('Updated by another coach');
    }, () => {});
    return un;
  }, [db, t.id]);

  /* persist */
  const persist = useCallback(async (state) => {
    const meta = { id: state.id, name: state.name, updatedAt: new Date().toISOString(), wrestlers: state.wrestlers.length, bouts: state.matches.length };
    if (db) {
      setSaving(true);
      try {
        await db.doc('tournaments/' + state.id).set({ state, savedBy: CLIENT, savedAt: meta.updatedAt });
        await db.doc('index/' + state.id).set({ name: meta.name, updatedAt: meta.updatedAt, wrestlers: meta.wrestlers, bouts: meta.bouts });
      } catch (e) {
        say(e?.code === 'not_granted' || e?.code === 'permission_denied' ? "You can view this but not save. Ask the owner for edit access." : `Couldn't save: ${e?.message || e?.code || 'unknown error'}`);
      } finally { setSaving(false); }
    } else {
      if (!LS.set('wmm.t.' + state.id, state)) say("This browser wouldn't save your changes. Its storage may be full or blocked (private window). Download a backup from the Tournaments menu now.");
      LS.set('wmm.last', state.id);
      setIndex(prev => { const next = [meta, ...prev.filter(x => x.id !== state.id)]; LS.set('wmm.index', next); return next; });
    }
    dirty.current = false;
  }, [db]);

  /* save immediately if the tab is closed, reloaded, or backgrounded mid-change */
  useEffect(() => {
    const flush = () => { if (dirty.current) { clearTimeout(saveTimer.current); persist(tRef.current); } };
    const vis = () => { if (document.visibilityState === 'hidden') flush(); };
    window.addEventListener('pagehide', flush); document.addEventListener('visibilitychange', vis);
    return () => { window.removeEventListener('pagehide', flush); document.removeEventListener('visibilitychange', vis); };
  }, [persist]);

  const scheduleSave = useCallback(() => {
    dirty.current = true; clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => persist(tRef.current), 800);
  }, [persist]);

  /* single entry point for every change: undo history + save */
  const update = useCallback((fn, label, quiet) => {
    setT(prev => {
      const next = fn(prev); if (next === prev) return prev;
      const now = Date.now();
      const merge = quiet && coalesce.current.label === label && now - coalesce.current.at < 1500;
      coalesce.current = { label, at: now };
      if (!merge) setPast(p => [...p.slice(-60), prev]);
      setFuture([]);
      return next;
    });
    if (label && !quiet) say(label);
    scheduleSave();
  }, [scheduleSave, say]);

  const undo = () => { if (!past.length) return; setFuture(f => [t, ...f]); setT(past[past.length - 1]); setPast(p => p.slice(0, -1)); scheduleSave(); say('Undone'); };
  const redo = () => { if (!future.length) return; setPast(p => [...p, t]); setT(future[0]); setFuture(f => f.slice(1)); scheduleSave(); say('Redone'); };
  useEffect(() => {
    const k = (e) => {
      if (!(e.ctrlKey || e.metaKey) || /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName)) return;
      if (e.key === 'z' && !e.shiftKey) { e.preventDefault(); undo(); } else if (e.key === 'y' || (e.key === 'z' && e.shiftKey)) { e.preventDefault(); redo(); }
    };
    window.addEventListener('keydown', k); return () => window.removeEventListener('keydown', k);
  });

  const counts = useMemo(() => countMap(t.matches), [t.matches]);
  const rest = useMemo(() => restReport(t.matches, t.settings.minRest), [t.matches, t.settings.minRest]);
  const teamById = Object.fromEntries(t.teams.map(x => [x.id, x]));

  const flash = (ids) => { setFreshIds(new Set(ids)); setTimeout(() => setFreshIds(new Set()), 2600); };

  /* late-add logic shared by add + restore */
  const placeLate = (w, base) => {
    if (!base.matches.length || !base.settings.autoPlace) return { state: base, msg: null };
    const { matches, added } = autoMatch(w, base);
    if (!added.length) return { state: base, msg: `${w.first} ${w.last} added. No opponent fits yet; use the Bouts tab.` };
    flash(added.map(a => a.m.id));
    const where = added.map(a => `#${a.m.mat * 100 + a.m.order + 1} vs ${a.opp.last} (Mat ${a.m.mat})`).join(', ');
    const warn = added.some(a => a.tier !== 'normal') ? ' · outside normal limits, check it' : '';
    return { state: { ...base, matches }, msg: `${w.first} ${w.last}: ${where}${warn}` };
  };

  const addWrestler = (f) => {
    const w = { id: uid(), ...f, scratched: false };
    let msg = null;
    update(p => { const r = placeLate(w, { ...p, wrestlers: [...p.wrestlers, w] }); msg = r.msg; return r.state; }, null);
    setTimeout(() => say(msg || `${w.first} ${w.last} added`), 0);
    setDialog(null);
  };
  const scratch = (w) => update(p => ({ ...p, wrestlers: p.wrestlers.map(x => x.id === w.id ? { ...x, scratched: true } : x), matches: renumber(p.matches.filter(m => m.a !== w.id && m.b !== w.id)) }), `${w.first} ${w.last} scratched · bouts removed`);
  const restore = (w) => {
    let msg = null;
    update(p => { const base = { ...p, wrestlers: p.wrestlers.map(x => x.id === w.id ? { ...x, scratched: false } : x) }; const r = placeLate({ ...w, scratched: false }, base); msg = r.msg; return r.state; }, null);
    setTimeout(() => say(msg || `${w.first} ${w.last} restored`), 0);
  };
  const addBout = (a, b) => {
    let label = '';
    update(p => {
      const spot = placeBout(p.matches, a.id, b.id, p.settings);
      const m = { id: uid(), a: a.id, b: b.id, ...spot }; flash([m.id]);
      label = `Bout #${spot.mat * 100 + spot.order + 1} added on Mat ${spot.mat}`;
      return { ...p, matches: [...p.matches, m] };
    }, null);
    setTimeout(() => say(label), 0);
  };
  const deleteBout = (id) => update(p => ({ ...p, matches: renumber(p.matches.filter(m => m.id !== id)) }), 'Bout removed');

  const runGenerate = () => {
    const active = t.wrestlers.filter(w => !w.scratched);
    if (active.length < 2) return say('Add wrestlers from at least two teams first');
    const matches = generate(t);
    update(p => ({ ...p, matches }), null);
    const c = countMap(matches); const low = active.filter(w => (c[w.id] || 0) < t.settings.minMatches).length;
    say(`Made ${matches.length} bouts across ${t.settings.mats} mats${low ? ` · ${low} wrestler${low === 1 ? '' : 's'} short, see Bouts` : ''}`);
    setTab('mats'); setDialog(null);
  };

  const switchTo = async (id) => {
    setMenu(false);
    if (dirty.current) { clearTimeout(saveTimer.current); await persist(tRef.current); }
    let next = null;
    if (db) { const snap = await db.doc('tournaments/' + id).get(); next = snap.exists ? snap.data().state : null; }
    else next = LS.get('wmm.t.' + id);
    if (!next) return say("Couldn't open that tournament");
    setT(next); setPast([]); setFuture([]); setSelectedId(null); LS.set('wmm.last', id);
    say(`Opened ${next.name}`);
  };
  openShared.current = switchTo;
  const createNew = async (seed) => {
    setMenu(false);
    if (dirty.current) { clearTimeout(saveTimer.current); await persist(tRef.current); }
    const nt = seed || newTournament(); setT(nt); setPast([]); setFuture([]); setSelectedId(null); setTab('roster');
    LS.set('wmm.last', nt.id); persist(nt);
  };
  const removeTournament = async (id) => {
    if (db) { await db.doc('tournaments/' + id).delete(); await db.doc('index/' + id).delete(); }
    else { LS.del('wmm.t.' + id); setIndex(prev => { const n = prev.filter(x => x.id !== id); LS.set('wmm.index', n); return n; }); }
    if (id === t.id) createNew();
    say('Tournament deleted');
  };

  const loadSample = () => {
    const nt = newTournament('Sample scramble');
    nt.teams = [
      { id: uid(), name: 'Mifflin Mustangs', abbr: 'MM', color: '#9b1c2e' },
      { id: uid(), name: 'Conestoga Valley', abbr: 'CV', color: '#2563eb' },
      { id: uid(), name: 'Penn Manor', abbr: 'PM', color: '#16a34a' },
    ];
    const firsts = ['Liam','Noah','Owen','Mason','Eli','Jack','Lucas','Ryan','Cole','Gavin','Luke','Wyatt','Caleb','Ava','Mia','Nate','Tyler','Evan','Brody','Max'];
    const lasts = ['Miller','Hoover','Diaz','Kline','Weaver','Martin','Zook','Stoltz','Brubaker','Hess','Garcia','Nolt','Ebersole','Lapp','Shirk','Reyes','Groff','Fisher','Burkholder','Kauffman'];
    let k = 0;
    nt.teams.forEach((tm) => { for (let i = 0; i < 14; i++, k++) {
      const age = 6 + (k * 7 % 6); const weight = Math.round((42 + age * 6 + ((k * 13) % 17)) * 2) / 2;
      nt.wrestlers.push({ id: uid(), first: firsts[k % 20], last: lasts[(k * 3) % 20], weight, dob: `${2026 - age - 1}-${String(1 + k % 12).padStart(2,'0')}-${String(1 + (k * 5) % 27).padStart(2,'0')}`, exp: Math.min(6, (k * 5) % 5), skill: 1 + (k * 7) % 5, team: tm.id, scratched: false });
    }});
    createNew(nt); say('Loaded a sample scramble. Rename or delete it from the Tournaments menu.');
  };
  useEffect(() => {
    const imp = LS.get('wmm.import'); if (!imp) return; LS.del('wmm.import');
    const tm = setTimeout(() => {
      const nt = newTournament(imp.name || 'Match night');
      const ids = imp.teams.map(() => uid());
      nt.teams = imp.teams.map((x, i) => ({ id: ids[i], name: x.name, abbr: x.abbr, color: x.color }));
      nt.wrestlers = imp.wrestlers.map(w => ({ id: uid(), first: w.first, last: w.last, weight: Number(w.weight) || 0, dob: w.dob || '', exp: w.exp || 0, skill: w.skill || 3, team: ids[w.teamIdx], scratched: false }));
      createNew(nt); say(`Loaded ${nt.wrestlers.length} available wrestlers from ${nt.teams.length} teams. Hit Generate bouts.`);
    }, 400);
    return () => clearTimeout(tm);
  }, []);

  const exportExcel = async () => {
    try {
      const wb = new ExcelJS.Workbook(); const argb = h => 'FF' + h.replace('#', '').toUpperCase();
      const wById = Object.fromEntries(t.wrestlers.map(x => [x.id, x]));
      const head = (row) => row.eachCell(c => { c.font = { bold: true }; c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFE8ECF2' } }; });

      /* Sheet 1: every wrestler by ascending weight, two columns of wrestlers per printed page */
      {
        const all = t.wrestlers.filter(w => !w.scratched).sort((a, b) => a.weight - b.weight || a.last.localeCompare(b.last));
        const ws = wb.addWorksheet('All Wrestlers');
        const PER_COL = 40, COLS = ['Wt', 'Team', 'Wrestler', 'Age', 'Exp', 'Skill', 'Bouts'], W = COLS.length, GAP = W + 1;
        [6, 6, 22, 5, 5, 5, 6].forEach((wd, i) => { ws.getColumn(i + 1).width = wd; ws.getColumn(GAP + 1 + i).width = wd; });
        ws.getColumn(GAP).width = 3;
        const title = ws.addRow([`${t.name} · ${fmtDOB(t.eventDate)} · ${all.length} wrestlers by weight`]);
        ws.mergeCells(1, 1, 1, W * 2 + 1); title.getCell(1).font = { bold: true, size: 13 };
        const hdr = ws.addRow([...COLS, '', ...COLS]);
        hdr.eachCell((c, n) => { if (n === GAP) return; c.font = { bold: true, size: 10 }; c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFE8ECF2' } }; c.border = { bottom: { style: 'thin', color: { argb: 'FF9AA4B5' } } }; c.alignment = { horizontal: n % GAP === 3 ? 'left' : 'center' }; });
        const fill = (cell, w, off, band) => {
          const tm = teamById[w.team];
          const vals = [w.weight, tm?.abbr || '', lastFirst(w), ageOn(w.dob, t.eventDate), w.exp, w.skill, counts[w.id] || 0];
          vals.forEach((v, i) => {
            const c = cell(off + i + 1); c.value = v; c.font = { size: 10, bold: i === 0 || i === 2 };
            c.alignment = { horizontal: i === 2 ? 'left' : 'center' };
            if (band) c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF4F6F9' } };
          });
          if (tm) { const c = cell(off + 2); c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: argb(tm.color) } }; c.font = { size: 10, bold: true, color: { argb: textOn(tm.color) === '#fff' ? 'FFFFFFFF' : 'FF111111' } }; }
        };
        for (let start = 0; start < all.length; start += PER_COL * 2) {
          const left = all.slice(start, start + PER_COL), right = all.slice(start + PER_COL, start + PER_COL * 2);
          let last = null;
          left.forEach((w, i) => {
            const row = ws.addRow([]); row.height = 15; const band = i % 2 === 1;
            fill(n => row.getCell(n), w, 0, band);
            if (right[i]) fill(n => row.getCell(n), right[i], GAP, band);
            last = row;
          });
          if (last && start + PER_COL * 2 < all.length) last.addPageBreak();
        }
        ws.pageSetup = { orientation: 'portrait', paperSize: 1, scale: 82, horizontalCentered: true,
          margins: { left: 0.4, right: 0.4, top: 0.5, bottom: 0.5, header: 0.2, footer: 0.2 }, printTitlesRow: '1:2' };
        ws.headerFooter.oddFooter = '&LSorted by weight, lightest first&RPage &P of &N';
        ws.views = [{ state: 'frozen', ySplit: 2 }];
      }
      /* One sheet per team. Wrestler blocks flow down two columns per Letter-portrait page. */
      t.teams.forEach(tm => {
        const roster = t.wrestlers.filter(w => w.team === tm.id && !w.scratched).sort((a, b) => a.last.localeCompare(b.last)); if (!roster.length) return;
        const ws = wb.addWorksheet(tm.name.replace(/[\\/?*[\]:]/g, '').slice(0, 31) || tm.abbr);
        const BW = 4, GAP = BW + 1, ROWS = 44, HDR = 2;
        [7, 5, 24, 6].forEach((wd, i) => { ws.getColumn(i + 1).width = wd; ws.getColumn(GAP + 1 + i).width = wd; });
        ws.getColumn(GAP).width = 3;
        const title = ws.addRow([`${tm.name} · ${t.name} · ${fmtDOB(t.eventDate)}`]);
        ws.mergeCells(1, 1, 1, BW * 2 + 1); title.getCell(1).font = { bold: true, size: 13 };
        const hdr = ws.addRow(['Bout', 'Mat', 'Opponent', 'Wt', '', 'Bout', 'Mat', 'Opponent', 'Wt']);
        hdr.eachCell((c, n) => { if (n === GAP) return; c.font = { bold: true, size: 10 }; c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFE8ECF2' } }; c.border = { bottom: { style: 'thin', color: { argb: 'FF9AA4B5' } } }; c.alignment = { horizontal: (n % GAP) === 3 ? 'left' : 'center' }; });
        let page = 0, col = 0, cur = 0;
        roster.forEach(w => {
          const ms = t.matches.filter(m => m.a === w.id || m.b === w.id).sort((a, b) => a.mat - b.mat || a.order - b.order);
          const h = 1 + Math.max(1, ms.length) + 1;
          if (cur + h - 1 > ROWS) { if (col === 0) col = 1; else { col = 0; page++; } cur = 0; }
          const off = col ? GAP : 0, r0 = HDR + page * ROWS + cur + 1;
          ws.mergeCells(r0, off + 1, r0, off + BW);
          const hc = ws.getCell(r0, off + 1);
          hc.value = `${lastFirst(w)} · ${w.weight} lb · age ${ageOn(w.dob, t.eventDate)} · skill ${w.skill}`;
          hc.font = { bold: true, size: 10, color: { argb: textOn(tm.color) === '#fff' ? 'FFFFFFFF' : 'FF111111' } };
          hc.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: argb(tm.color) } };
          hc.alignment = { horizontal: 'left', vertical: 'middle' };
          if (!ms.length) { const c = ws.getCell(r0 + 1, off + 3); c.value = 'No bouts'; c.font = { size: 10, italic: true, color: { argb: 'FF9AA4B5' } }; }
          ms.forEach((m, i) => {
            const o = wById[m.a === w.id ? m.b : m.a]; const ot = teamById[o.team]; const r = r0 + 1 + i;
            const vals = [m.mat * 100 + m.order + 1, m.mat, `${ot?.abbr || ''} ${lastFirst(o)}`, o.weight];
            vals.forEach((v, k) => {
              const c = ws.getCell(r, off + 1 + k); c.value = v; c.alignment = { horizontal: k === 2 ? 'left' : 'center' };
              c.font = k === 2 ? { size: 10, bold: true, color: { argb: argb(ot?.color || '#555555') } } : { size: 10 };
              c.border = { bottom: { style: 'hair', color: { argb: 'FFB9C2D0' } } };
            });
          });
          cur += h;
        });
        for (let p = 0; p < page; p++) ws.getRow(HDR + (p + 1) * ROWS).addPageBreak();
        ws.pageSetup = { orientation: 'portrait', paperSize: 1, scale: 100, horizontalCentered: true,
          margins: { left: 0.4, right: 0.4, top: 0.5, bottom: 0.5, header: 0.2, footer: 0.2 }, printTitlesRow: '1:2' };
        ws.headerFooter.oddFooter = `&L${tm.name.replace(/&/g, '&&')}&RPage &P of &N`;
        ws.views = [{ state: 'frozen', ySplit: 2 }];
      });
      /* One sheet per mat, Letter portrait, fit to one page wide, header rows repeat. */
      for (let mat = 1; mat <= t.settings.mats; mat++) {
        const ms = t.matches.filter(m => m.mat === mat).sort((a, b) => a.order - b.order); if (!ms.length) continue;
        const ws = wb.addWorksheet(`Mat ${mat}`);
        [7, 6, 24, 6, 4, 6, 24, 6, 7, 16].forEach((w, i) => ws.getColumn(i + 1).width = w);
        const title = ws.addRow([`Mat ${mat} · ${t.name} · ${fmtDOB(t.eventDate)} · ${ms.length} bouts`]);
        ws.mergeCells(1, 1, 1, 10); title.getCell(1).font = { bold: true, size: 13 };
        head(ws.addRow(['Bout', 'Team', 'Wrestler', 'Wt', '', 'Team', 'Wrestler', 'Wt', 'Wt %', 'Winner']));
        ms.forEach(m => {
          const A = wById[m.a], B = wById[m.b]; const ta = teamById[A.team], tb = teamById[B.team];
          const r = ws.addRow([m.mat * 100 + m.order + 1, ta?.abbr, lastFirst(A), A.weight, 'vs', tb?.abbr, lastFirst(B), B.weight, compare(A, B, t.eventDate).wtPct.toFixed(1) + '%', '']);
          r.height = 20; r.eachCell({ includeEmpty: true }, c => { c.alignment = { vertical: 'middle' }; c.border = { bottom: { style: 'hair', color: { argb: 'FFB9C2D0' } } }; });
          [2, 3].forEach(c => r.getCell(c).font = { bold: true, color: { argb: argb(ta?.color || '#555555') } });
          [6, 7].forEach(c => r.getCell(c).font = { bold: true, color: { argb: argb(tb?.color || '#555555') } });
        });
        ws.pageSetup = { orientation: 'portrait', paperSize: 1, fitToPage: true, fitToWidth: 1, fitToHeight: 0, horizontalCentered: true,
          margins: { left: 0.4, right: 0.4, top: 0.5, bottom: 0.5, header: 0.2, footer: 0.2 }, printTitlesRow: '1:2' };
        ws.headerFooter.oddFooter = `&LMat ${mat}&RPage &P of &N`;
        ws.views = [{ state: 'frozen', ySplit: 2 }];
      }
      const buf = await wb.xlsx.writeBuffer();
      await saveFile(`${t.name.replace(/[^\w\- ]+/g, '').trim() || 'bouts'}.xlsx`, new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
    } catch (e) { if (e?.code !== 'cancelled') say(`Export didn't finish: ${e?.message || e?.code || 'unknown error'}`); }
  };
  const exportJSON = async () => { try { await saveFile(`${t.name.replace(/[^\w\- ]+/g, '').trim() || 'tournament'}.json`, new Blob([JSON.stringify({ format: 'wmm-2', tournament: t }, null, 1)], { type: 'application/json' })); } catch (e) { say(`Backup didn't finish: ${e?.message || 'unknown error'}`); } };
  const jsonRef = useRef(null);
  const importJSON = (e) => {
    const file = e.target.files[0]; e.target.value = ''; if (!file) return;
    const r = new FileReader();
    r.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        const nt = data.format === 'wmm-2' ? { ...data.tournament, id: uid() } : data.rosters ? fromLegacy(data, file.name.replace(/\.json$/i, '')) : null;
        if (!nt) return say("That file isn't a Wrestling Pairing Pro backup");
        createNew(nt); say(`Imported ${nt.name}`);
      } catch { say("That file isn't valid JSON"); }
    };
    r.readAsText(file);
  };

  const active = t.wrestlers.filter(w => !w.scratched);
  const hasMatches = t.matches.length > 0;
  const blankForm = { first: '', last: '', weight: '', dob: '', exp: '0', skill: '1', team: t.teams[0]?.id };

  return (
    <>
      <header className="top">
        <div className="brand"><span className="brand-mark"><i /></span><h1>Wrestling Pairing Pro</h1></div>
        <input id="tname" className="tname" value={t.name} onChange={e => update(p => ({ ...p, name: e.target.value }), 'Rename', true)} aria-label="Tournament name" />
        <span className={`store ${mode === 'shared' ? 'shared' : ''} ${saving ? 'saving' : ''}`} title={mode === 'shared' ? 'Everyone with access to this page sees the same tournaments, live.' : 'Saved only in this browser on this device.'}>
          <b />{mode === 'starting' ? 'Connecting…' : mode === 'shared' ? (saving ? 'Saving…' : 'Shared · live') : 'Saved in this browser'}
        </span>
        <span className="spacer" />
        <button className="btn sm" onClick={undo} disabled={!past.length} title="Undo (Ctrl+Z)" aria-label="Undo">{I.undo}</button>
        <button className="btn sm" onClick={redo} disabled={!future.length} title="Redo (Ctrl+Y)" aria-label="Redo">{I.redo}</button>
        <div style={{ position: 'relative' }}>
          <button className="btn" onClick={() => setMenu(!menu)} aria-expanded={menu}>Tournaments {I.down}</button>
          {menu && <div className="menu" onMouseLeave={() => setMenu(false)}>
            <button className="item" onClick={() => createNew()}><b>+ New tournament</b></button>
            <button className="item" onClick={() => { setMenu(false); loadSample(); }}>Load sample scramble</button>
            <hr />
            <div className="eyebrow" style={{ padding: '4px 10px' }}>{mode === 'shared' ? 'Shared tournaments' : 'Saved in this browser'}</div>
            {!index.length && <div className="small muted" style={{ padding: '4px 10px' }}>None saved yet. Changes save automatically.</div>}
            <div style={{ maxHeight: 280, overflow: 'auto' }}>
              {index.map(x => (
                <div key={x.id} className="row" style={{ flexWrap: 'nowrap', padding: '0 4px' }}>
                  <button className="item" style={{ flex: 1, minWidth: 0, fontWeight: x.id === t.id ? 700 : 400 }} onClick={() => x.id !== t.id && switchTo(x.id)}>
                    <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{x.name}</span>
                    <span className="small muted" style={{ marginLeft: 'auto', whiteSpace: 'nowrap' }}>{x.updatedAt ? new Date(x.updatedAt).toLocaleDateString() : ''}</span>
                  </button>
                  <ConfirmButton label="Delete" confirmLabel="Sure?" className="btn sm ghost" onConfirm={() => removeTournament(x.id)} />
                </div>
              ))}
            </div>
            <hr />
            <button className="item" onClick={() => { setMenu(false); exportJSON(); }}>Download backup (.json)</button>
            <button className="item" onClick={() => { setMenu(false); jsonRef.current.click(); }}>Open a backup…</button>
          </div>}
          <input ref={jsonRef} type="file" accept=".json,application/json" hidden onChange={importJSON} />
        </div>
        {hasMatches && <button className="btn" onClick={exportExcel}>Export Excel</button>}
        <button className="btn primary" disabled={active.length < 2} onClick={() => hasMatches ? setDialog({ type: 'regen' }) : runGenerate()}>{hasMatches ? 'Regenerate' : 'Generate bouts'}</button>
      </header>

      <nav className="tabs" role="tablist">
        {[['roster', 'Roster', active.length], ['bouts', 'Bouts', t.matches.length], ['mats', 'Mats', null], ['settings', 'Settings', null]].map(([k, l, n]) => (
          <button key={k} role="tab" className="tab" aria-selected={tab === k} onClick={() => setTab(k)}>{l}{n !== null && <span className="n">{n}</span>}</button>
        ))}
      </nav>

      {!t.wrestlers.length && tab !== 'settings' ? (
        <div className="panel empty">
          <h2>Set up a scramble</h2>
          <p className="muted" style={{ maxWidth: 560, margin: 0 }}>Load each team's roster, generate bouts, then fine-tune the mats. Wrestlers you add after bouts exist get matched and put on the least busy mat automatically.</p>
          <div className="steps">
            <div><b>1 · Rosters</b><span className="small muted">Name the teams, then upload a CSV/Excel file or paste rows: First, Last, Weight, DOB, Exp, Skill.</span></div>
            <div><b>2 · Generate</b><span className="small muted">Pairs by weight %, age, and skill. Mats are grouped by skill and kept the same length.</span></div>
            <div><b>3 · Run the mats</b><span className="small muted">Drag bouts between mats. Rest conflicts are flagged and one click re-sequences them.</span></div>
          </div>
          <div className="row" style={{ justifyContent: 'center' }}>
            <button className="btn primary" onClick={() => setDialog({ type: 'import', team: t.teams[0]?.id, text: '' })}>Paste a roster</button>
            <button className="btn" onClick={() => setTab('roster') || setDialog(null)} style={{ display: tab === 'roster' ? 'none' : undefined }}>Go to Roster</button>
            <button className="btn" onClick={loadSample}>Try a sample scramble</button>
          </div>
          {tab === 'roster' && <div style={{ width: '100%', textAlign: 'left', marginTop: 16 }}><RosterTab t={t} update={update} counts={counts} openImport={(team, text) => setDialog({ type: 'import', team, text })} openAdd={() => setDialog({ type: 'add' })} openEdit={(w) => setDialog({ type: 'edit', w })} scratch={scratch} restore={restore} /></div>}
        </div>
      ) : <>
        {tab === 'roster' && <RosterTab t={t} update={update} counts={counts} openImport={(team, text) => setDialog({ type: 'import', team, text })} openAdd={() => setDialog({ type: 'add' })} openEdit={(w) => setDialog({ type: 'edit', w })} scratch={scratch} restore={restore} />}
        {tab === 'bouts' && <BoutsTab t={t} counts={counts} selectedId={selectedId} setSelectedId={setSelectedId} addBout={addBout} deleteBout={deleteBout} onlyLow={onlyLow} setOnlyLow={setOnlyLow} />}
        {tab === 'mats' && (hasMatches ? <MatsTab t={t} update={update} counts={counts} rest={rest} freshIds={freshIds} goLow={() => { setOnlyLow(true); setTab('bouts'); }} /> :
          <div className="panel empty"><h2>No bouts yet</h2><p className="muted" style={{ margin: 0 }}>{active.length} wrestlers on the roster.</p><button className="btn primary" disabled={active.length < 2} onClick={runGenerate}>Generate bouts</button></div>)}
        {tab === 'settings' && <SettingsTab t={t} update={update} />}
      </>}

      {dialog?.type === 'import' && <ImportDialog teams={t.teams} initialTeam={dialog.team} initialText={dialog.text} onClose={() => setDialog(null)}
        onImport={(team, rows) => {
          const ws = rows.map(r => ({ id: uid(), ...r, team, scratched: false }));
          let msg = `Imported ${ws.length} wrestler${ws.length === 1 ? '' : 's'} to ${teamById[team]?.name}`;
          update(p => {
            let st = { ...p, wrestlers: [...p.wrestlers, ...ws] };
            if (p.matches.length && p.settings.autoPlace) { let placed = 0; ws.forEach(w => { const r = autoMatch(w, st); placed += r.added.length; st = { ...st, matches: r.matches }; if (r.added.length) flash(r.added.map(a => a.m.id)); }); msg += ` · ${placed} bouts placed on the least busy mats`; }
            return st;
          }, null);
          setTimeout(() => say(msg), 0); setDialog(null);
        }} />}
      {dialog?.type === 'add' && <Modal title="Add wrestler" onClose={() => setDialog(null)}>
        {hasMatches && t.settings.autoPlace && <div className="notice info small">Bouts already exist, so this wrestler will be matched right away and put on the least busy mat.</div>}
        <WrestlerForm initial={blankForm} teams={t.teams} saveLabel="Add wrestler" onCancel={() => setDialog(null)} onSave={addWrestler} />
      </Modal>}
      {dialog?.type === 'edit' && <Modal title={`Edit ${dialog.w.first} ${dialog.w.last}`} onClose={() => setDialog(null)}>
        <WrestlerForm initial={{ ...dialog.w, weight: String(dialog.w.weight), exp: String(dialog.w.exp), skill: String(dialog.w.skill) }} teams={t.teams} saveLabel="Save changes" onCancel={() => setDialog(null)}
          onSave={(f) => { update(p => ({ ...p, wrestlers: p.wrestlers.map(x => x.id === dialog.w.id ? { ...x, ...f } : x), matches: f.team !== dialog.w.team ? renumber(p.matches.filter(m => !((m.a === dialog.w.id && p.wrestlers.find(o => o.id === m.b)?.team === f.team) || (m.b === dialog.w.id && p.wrestlers.find(o => o.id === m.a)?.team === f.team)))) : p.matches }), `Saved ${f.first} ${f.last}`); setDialog(null); }} />
      </Modal>}
      {dialog?.type === 'regen' && <Modal title="Regenerate all bouts?" onClose={() => setDialog(null)}>
        <p style={{ margin: 0 }}>This replaces all {t.matches.length} bouts, including any you moved or added by hand. You can undo it afterward.</p>
        <div className="row"><button className="btn primary" onClick={runGenerate}>Regenerate</button><button className="btn" onClick={() => setDialog(null)}>Cancel</button></div>
      </Modal>}

      {toast && <div className={`toast ${tab === 'mats' ? 'raise' : ''}`} role="status">{toast}</div>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body></html>
